name: Tag and release
description: >-
  Use in a job with contents: write, after checking out the commit being built. Reads the version
  from the root package.json and creates the tag holyagent-<version> (with commit UTC time and short
  hash for a pre-release) on that commit, then a GitHub Release for it. Re-running on the same
  commit changes nothing; a tag on another commit fails the job.

inputs:
  prerelease:
    description: Whether to publish a development pre-release, which never becomes the latest release.
    required: false
    default: "false"
  notes:
    description: The release notes; empty generates them from the commits since the previous stable release.
    required: false
    default: ""
  token:
    description: A token with write access to repository contents.
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    # Values reach the script through env, never interpolated into it, so a branch name or a note
    # cannot inject commands.
    - name: Create the tag and the release
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        NOTES: ${{ inputs.notes }}
        PRERELEASE: ${{ inputs.prerelease }}
        SHA: ${{ github.sha }}
      run: |
        set -euo pipefail

        # The one place the version of a release is read. It takes the shape parseVersion in
        # scripts/bump-version.ts takes: 0.X.Y, with the legacy -Z suffix dropped, so the tag never
        # carries it. The anchored match also keeps a newline out of the tag name.
        number='(0|[1-9][0-9]*)'
        version="$(jq -r .version package.json)"
        if ! [[ "$version" =~ ^(0\.${number}\.${number})(-[1-9][0-9]*)?$ ]]; then
          echo "::error::The version ${version} in package.json is not 0.X.Y."
          exit 1
        fi
        version="${BASH_REMATCH[1]}"
        TAG="holyagent-${version}"
        TITLE="HolyAgent ${version}"
        if [ "$PRERELEASE" = "true" ]; then
          version="$(bash .github/actions/tag-release/dev-version.sh)"
          TAG="holyagent-${version}"
          TITLE="HolyAgent ${version}"
        fi

        # Only a 404 means the tag is absent: any other failure must not look like "absent".
        if ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq '.object.type + " " + .object.sha' 2>&1)"; then
          read -r type found <<<"$ref"
          # An annotated tag points at a tag object, which points at the commit.
          if [ "$type" = "tag" ]; then
            found="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${found}" --jq .object.sha)"
          fi
          if [ "$found" != "$SHA" ]; then
            echo "::error::The tag ${TAG} already exists on ${found}, not on ${SHA}. Bump the version, or delete the stale tag and release deliberately."
            exit 1
          fi
          echo "The tag ${TAG} already points at ${SHA}."
        elif ! grep -q "HTTP 404" <<<"$ref"; then
          echo "::error::Could not look up the tag ${TAG}: ${ref}"
          exit 1
        fi

        if release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" 2>&1)"; then
          echo "The release ${TAG} exists; nothing to do."
          exit 0
        elif ! grep -q "HTTP 404" <<<"$release"; then
          echo "::error::Could not look up the release ${TAG}: ${release}"
          exit 1
        fi

        args=(--target "$SHA" --title "$TITLE")
        if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease --latest=false); fi
        if [ -n "$NOTES" ]; then
          args+=(--notes "$NOTES")
        else
          args+=(--generate-notes)
          # Without a start tag GitHub picks the previous tag by date, which can be a development
          # tag and would cut the notes short. For a stable release start from the newest older
          # stable release instead. A pre-release keeps GitHub's choice: its own tag is not stable,
          # so there is no stable tag to place it after. A failed listing fails the step rather
          # than silently falling back to date-picked notes.
          if [ "$PRERELEASE" != "true" ]; then
            stable="$(gh release list --exclude-pre-releases --exclude-drafts --limit 200 --json tagName --jq '.[].tagName')"
            previous="$(
              { printf '%s\n' "$stable"; echo "$TAG"; } |
                grep -E "^holyagent-0\.${number}\.${number}\$" | sort -uV | grep -x -B1 -- "$TAG" | head -n1
            )"
            if [ -n "$previous" ] && [ "$previous" != "$TAG" ]; then args+=(--notes-start-tag "$previous"); fi
          fi
        fi
        gh release create "$TAG" "${args[@]}"
