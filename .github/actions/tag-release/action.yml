name: Tag and release
description: >-
  Use in a job with contents: write. Creates the tag on the commit being built and a GitHub Release
  for it. Re-running on the same commit changes nothing; a tag on another commit fails the job.

inputs:
  tag:
    description: The tag to create, for example holyagent-0.2.1.
    required: true
  title:
    description: The title of the release.
    required: true
  notes:
    description: The release notes; empty generates them from the commits since the previous release.
    required: false
    default: ""
  prerelease:
    description: Whether the release is a pre-release, which never becomes the latest release.
    required: false
    default: "false"
  token:
    description: A token with write access to repository contents.
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    # Values reach the script through env, never interpolated into it, so a branch name or a note
    # cannot inject commands.
    - name: Create the tag and the release
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        TAG: ${{ inputs.tag }}
        TITLE: ${{ inputs.title }}
        NOTES: ${{ inputs.notes }}
        PRERELEASE: ${{ inputs.prerelease }}
        SHA: ${{ github.sha }}
      run: |
        set -euo pipefail

        # Only a 404 means the tag is absent: any other failure must not look like "absent".
        if ref="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" --jq '.object.type + " " + .object.sha' 2>&1)"; then
          read -r type found <<<"$ref"
          # An annotated tag points at a tag object, which points at the commit.
          if [ "$type" = "tag" ]; then
            found="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${found}" --jq .object.sha)"
          fi
          if [ "$found" != "$SHA" ]; then
            echo "::error::The tag ${TAG} already exists on ${found}, not on ${SHA}. Bump the version, or delete the stale tag and release deliberately."
            exit 1
          fi
          echo "The tag ${TAG} already points at ${SHA}."
        elif ! grep -q "HTTP 404" <<<"$ref"; then
          echo "::error::Could not look up the tag ${TAG}: ${ref}"
          exit 1
        fi

        if gh release view "$TAG" >/dev/null 2>&1; then
          echo "The release ${TAG} exists; nothing to do."
          exit 0
        fi

        args=(--target "$SHA" --title "$TITLE")
        if [ "$PRERELEASE" = "true" ]; then args+=(--prerelease --latest=false); fi
        if [ -n "$NOTES" ]; then args+=(--notes "$NOTES"); else args+=(--generate-notes); fi
        gh release create "$TAG" "${args[@]}"
