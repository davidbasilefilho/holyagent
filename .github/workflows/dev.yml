name: Dev

on:
  workflow_call:

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/dev' && github.ref_protected
    environment: npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up tools
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Pack prerelease
        run: |
          set -euo pipefail
          version="$(jq -r .version package.json)"
          test "$(jq -r .version packages/integrations/pi/dist/package.json)" = "$version"
          version="$(bash .github/actions/tag-release/dev-version.sh)"
          cd packages/integrations/pi/dist
          jq --arg version "$version" '.version = $version' package.json > "$RUNNER_TEMP/package.json"
          cp "$RUNNER_TEMP/package.json" package.json
          bun pm pack --destination "$RUNNER_TEMP"
      - name: Publish package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(bash .github/actions/tag-release/dev-version.sh)"
          tag="holyagent-$version"
          bun scripts/npm-publishing.ts "$RUNNER_TEMP/holyagent-$version.tgz" dev "$tag"
      - name: Transfer published package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/holyagent-*.tgz
          if-no-files-found: error

  prerelease:
    needs: publish
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/dev' && github.ref_protected }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Set up tools
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      - name: Install verification dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Reconcile the previous protected dev prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_DEV: ${{ github.event.before }}
        run: bun scripts/dev-prerelease-recovery.ts previous "$PREVIOUS_DEV"
      - name: Download published package
        if: needs.publish.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: ${{ runner.temp }}
      - name: Reconcile the current protected dev prerelease
        if: needs.publish.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(bash .github/actions/tag-release/dev-version.sh)"
          bun scripts/dev-prerelease-recovery.ts current "$RUNNER_TEMP/holyagent-$version.tgz"
      - name: Require a successful current publication
        if: ${{ !cancelled() && needs.publish.result != 'success' }}
        run: exit 1
