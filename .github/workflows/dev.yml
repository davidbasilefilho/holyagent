name: Dev

# Called by publish.yml for a push to any branch but main. Tags the commit
# holyagent-<version>-dev-<short-hash> and publishes a pre-release, once per commit: a re-run finds
# the tag on the same commit and does nothing.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  prerelease:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the version
        id: version
        run: |
          version="$(jq -r .version package.json)"
          if ! [[ "$version" =~ ^0\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::The version ${version} in package.json is not 0.X.Y."
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Tag and pre-release
        uses: ./.github/actions/tag-release
        with:
          tag: holyagent-${{ steps.version.outputs.version }}-dev-${{ steps.version.outputs.short }}
          title: HolyAgent ${{ steps.version.outputs.version }} dev ${{ steps.version.outputs.short }}
          notes: Development build of ${{ github.ref_name }} at ${{ github.sha }}.
          prerelease: "true"
