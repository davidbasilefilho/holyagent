name: Dev

on:
  workflow_call:

permissions:
  contents: read

jobs:
  publish:
    if: startsWith(github.ref, 'refs/heads/release/') && endsWith(github.ref, '/integration') && github.ref_protected
    environment: npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Pack prerelease
        run: |
          set -euo pipefail
          version="$(jq -r .version package.json)"
          test "$(jq -r .version packages/integrations/pi/dist/package.json)" = "$version"
          version="$version-dev-${GITHUB_SHA:0:7}"
          cd packages/integrations/pi/dist
          jq --arg version "$version" '.version = $version' package.json > "$RUNNER_TEMP/package.json"
          cp "$RUNNER_TEMP/package.json" package.json
          bun pm pack --destination "$RUNNER_TEMP"
      - name: Publish package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          root_version="$(jq -r .version package.json)"
          [[ "$root_version" =~ ^(0\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))(-[1-9][0-9]*)?$ ]]
          tag="holyagent-${BASH_REMATCH[1]}-dev-${GITHUB_SHA:0:7}"
          version="$root_version-dev-${GITHUB_SHA:0:7}"
          bun scripts/npm-publishing.ts "$RUNNER_TEMP/holyagent-$version.tgz" dev "$tag"
      - name: Transfer published package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/holyagent-*.tgz
          if-no-files-found: error

  prerelease:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download published package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: ${{ runner.temp }}
      - name: Tag and pre-release
        uses: ./.github/actions/tag-release
        with:
          notes: Development build of ${{ github.ref_name }} at ${{ github.sha }}.
          prerelease: "true"
      - name: Attach package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(jq -r .version package.json)-dev-${GITHUB_SHA:0:7}"
          gh release upload "holyagent-$version" "$RUNNER_TEMP/holyagent-$version.tgz" --clobber
