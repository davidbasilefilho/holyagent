name: Publish

# Pull requests validate work branches. Only the publishing refs need validation on push, before
# publication can use their pushed commit. Pushed tags never start this workflow.
on:
  push:
    branches: [main, dev]

permissions:
  contents: read

# A newer push queues behind a running one instead of cancelling a half-done release. The called
# validation never cancels a push run either (see validation.yml).
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validation:
    uses: ./.github/workflows/validation.yml

  # Only the jobs that call the tagging workflows may write contents.
  stable:
    needs: validation
    if: github.ref == 'refs/heads/main' && github.ref_protected
    uses: ./.github/workflows/stable.yml
    permissions:
      contents: write
      id-token: write

  dev:
    needs: validation
    if: github.ref == 'refs/heads/dev' && github.ref_protected
    uses: ./.github/workflows/dev.yml
    permissions:
      contents: write
      id-token: write
