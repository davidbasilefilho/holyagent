name: Publish

# Runs on branch pushes only: with a branch filter and no `tags` filter, a pushed tag never starts
# it, so the tags it creates cannot loop back in. Nothing is tagged until validation passes for the
# pushed commit. The holyagent/state branch holds records, not the project, so it has nothing to
# validate or tag.
on:
  push:
    branches-ignore: [holyagent/state]

permissions:
  contents: read

# A newer push queues behind a running one instead of cancelling a half-done release. The called
# validation never cancels a push run either (see validation.yml).
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validation:
    uses: ./.github/workflows/validation.yml

  # Only the jobs that call the tagging workflows may write contents.
  stable:
    needs: validation
    if: github.ref == 'refs/heads/main' && github.ref_protected
    uses: ./.github/workflows/stable.yml
    permissions:
      contents: write
      id-token: write

  dev:
    needs: validation
    if: github.ref == 'refs/heads/dev' && github.ref_protected
    uses: ./.github/workflows/dev.yml
    permissions:
      contents: write
      id-token: write
