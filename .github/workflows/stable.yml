name: Stable

# Called by publish.yml for a push to main, which is the only caller. Tags the commit
# holyagent-<version> and publishes a GitHub Release from the version in the root package.json. A
# tag on another commit fails the run: main moved on without a version bump.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tag and release
        uses: ./.github/actions/tag-release
