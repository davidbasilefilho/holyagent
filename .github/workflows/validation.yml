name: Validation

# Runs on pull requests, and publish.yml calls it for every branch push so nothing is tagged
# unvalidated. The job names below (check, windows, installers, branch-model, version) are the
# status check contexts of pull requests; the rulesets in docs/development.md require them by name.
on:
  # `edited` also covers a changed base branch, which the branch-model job must see again.
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_call:

permissions:
  contents: read

# Only a pull request run is cancelled by a newer one. A push run is called by publish.yml, which
# queues pushes itself; cancelling it would fail that publish and leave the commit untagged.
concurrency:
  group: validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Enforces the release-branch model in AGENTS.md. The refs go through env so a branch name is
  # never interpolated into the script. A pull request from a fork fails: its branch names are its
  # own to choose, so they prove nothing about the model.
  branch-model:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # First, before anything from the head is checked out or run: a fork controls its own files.
      # An empty name (a deleted fork) fails too.
      - name: Require a head in this repository
        env:
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ -z "$HEAD_REPOSITORY" ] || [ "${HEAD_REPOSITORY,,}" != "${GITHUB_REPOSITORY,,}" ]; then
            echo "::error::The head repository \"$HEAD_REPOSITORY\" is not $GITHUB_REPOSITORY; open the pull request from a branch of this repository."
            exit 1
          fi

      # The head commit, not the merge commit: its package.json is the version the head carries.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Check the branch model
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: bun scripts/pr-checks.ts branch-model "$BASE_REF" "$HEAD_REF"

  # A same-version publication repair requires confirmation from the public npm registry.
  version:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # First, before anything from the head is checked out or run: a fork controls its own files.
      # An empty name (a deleted fork) fails too.
      - name: Require a head in this repository
        env:
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ -z "$HEAD_REPOSITORY" ] || [ "${HEAD_REPOSITORY,,}" != "${GITHUB_REPOSITORY,,}" ]; then
            echo "::error::The head repository \"$HEAD_REPOSITORY\" is not $GITHUB_REPOSITORY; open the pull request from a branch of this repository."
            exit 1
          fi

      - name: Check out the head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          path: main
          persist-credentials: false

      - name: Set up tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Check the version
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: bun scripts/pr-checks.ts version main . "$HEAD_REF"

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the tools in mise.toml. mise runs its postinstall hook after `mise install`, which
      # upgrades the stable Bun to the canary build that `bun check`, `bun lint` and `bun fmt` need.
      - name: Set up tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7

      - name: Check the toolchain
        run: mise run toolchain

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify
        run: mise run verify

      - name: Check the generated plugin is current
        run: |
          mise run build
          # Porcelain output lists modified, deleted and untracked files; these are the paths
          # packages/integrations/claude/build.ts and packages/integrations/pi/build.ts generate
          # (their GENERATED_PATHS).
          status="$(git status --porcelain --ignored -- \
            .claude-plugin/marketplace.json \
            packages/integrations/claude/dist \
            packages/integrations/pi/dist)"
          if [ -n "$status" ]; then
            echo "$status"
            echo "::error::The generated plugin or Pi package is stale. Run 'mise run build' and commit the files it writes."
            exit 1
          fi

      - name: Validate the plugin and the marketplace
        env:
          DISABLE_AUTOUPDATER: "1"
        run: |
          # Claude Code is a locked devDependency, so a new release cannot turn the job red on its
          # own and the binary is integrity-checked; validation needs no credentials.
          bun run claude plugin validate --strict packages/integrations/claude/dist
          bun run claude plugin validate --strict .

      - name: Lint the install script
        run: |
          if [ -f install/wsl-install.sh ]; then
            shellcheck install/wsl-install.sh
          fi

  # Runs the test suite on native Windows with the same toolchain as `check`, so Windows failures
  # show up on every pull request.
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7

      - name: Check the toolchain
        run: mise run toolchain

      # Use the native mise supplied above; exercise trusted lifecycle scripts on Windows too.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: mise run test

  macos:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify
        run: mise run verify

  installers:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Syntax only: neither installer runs, since both change the machine they run on.
      - name: Parse the WSL installer
        run: bash -n install/wsl-install.sh

      # ubuntu-latest ships PowerShell (pwsh), so the Windows installer is parsed there too.
      - name: Parse the Windows installer
        shell: pwsh
        run: |
          $errors = $null
          $tokens = $null
          $file = Join-Path $PWD 'install/windows-install.ps1'
          [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$errors) | Out-Null
          foreach ($e in $errors) {
            Write-Host "::error file=install/windows-install.ps1,line=$($e.Extent.StartLineNumber)::$($e.Message)"
          }
          if ($errors.Count -gt 0) { exit 1 }
