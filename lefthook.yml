# Takes agent attribution out of every commit message, `git commit` by hand included, and refuses a
# message that talks about the user or the agent. `{1}` is the message file git passes.
commit-msg:
  jobs:
    - name: attribution
      run: >-
        bun --no-env-file --config=packages/integrations/claude/dist/scripts/empty-bunfig.toml
        packages/integrations/claude/dist/scripts/holyagent.js hook commit-msg {1}

# Hooks use the same tasks as CI through native mise on PATH (see docs/development.md).
# `bunx --no-install` never downloads the unsupported npm wrapper. Arguments after `--`
# go to the underlying Bun command.
# `--staged` limits lint and fmt to the staged files, and Bun leaves a partly staged file unwritten
# rather than committing its unstaged changes. `stage_fixed` re-stages what lint fixed, since the
# `bun lint` docs do not say `--staged --fix` stages again (`bun fmt --staged` does). `piped` stops at
# the first failing job.
pre-commit:
  piped: true
  jobs:
    - name: lint
      run: bunx --no-install mise run lint:fix -- --staged
      stage_fixed: true
    - name: fmt
      run: bunx --no-install mise run fmt -- --staged
      stage_fixed: true
    # Stages exactly the paths build.ts generates (its GENERATED_PATHS), deletions included, so a
    # commit always carries a plugin in step with its sources.
    - name: build
      run: >-
        bunx --no-install mise run build && git add -A --
        .claude-plugin/marketplace.json
        packages/integrations/claude/dist
    # Stages exactly the paths the Pi build generates (GENERATED_PATHS in its src/generate.ts).
    - name: build-pi
      run: git add -A -- packages/integrations/pi/dist
    # The build copies the version of the root package.json into the workspace manifests and
    # bun.lock (`syncVersions`). When a package.json is staged, as in a version bump, those copies
    # are staged too, so the commit carries every copy of the version; otherwise they are left alone.
    - name: versions
      glob: package.json
      run: git add -- packages/core/package.json packages/runtime/package.json packages/integrations/claude/package.json packages/integrations/pi/package.json bun.lock
