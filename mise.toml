[tools]
# Billion Context and ctx7 run on Node.
node = "lts"
# The toolchain is Bun's builtin `bun check`, `bun lint` and `bun fmt`, which exist only in canary
# builds, and mise cannot install bun@canary. mise installs the stable base and the postinstall hook
# below upgrades it to canary; the `toolchain` task, which every gate depends on, fails on a
# non-canary Bun and names the fix.
bun = "1.4.4"

[hooks]
# Runs after `mise install` (also on `mise use` and the automatic install before `mise run`), with
# the mise-installed Bun first on PATH. Idempotent: a canary Bun is left alone. BUN_OPTIONS is unset
# for the upgrade because Bun reads its flags (e.g. --smol) as package names and refuses.
postinstall = "bun --revision | grep -q canary || env -u BUN_OPTIONS bun upgrade --canary"

# mise tasks are the single source of truth for commands. package.json scripts and lefthook only
# delegate here, and `--no-script` makes Bun run its own tool instead of the same-named script.

[tasks.toolchain]
description = "Fail unless Bun is a canary build"
run = "bun --revision | grep -q canary || { echo 'bun is not a canary build; run: env -u BUN_OPTIONS bun upgrade --canary' >&2; exit 1; }"

[tasks.prepare]
description = "Install the git hooks (skipped outside a git work tree, e.g. a `git archive` export)"
run = "if git rev-parse --is-inside-work-tree >/dev/null 2>&1; then bunx lefthook install; else echo 'not a git repository; skipping git hooks'; fi"

[tasks.check]
description = "Type-check the repository"
depends = ["toolchain"]
run = "bun check --no-script"

[tasks.lint]
description = "Lint the repository with type-aware rules, without fixing"
depends = ["toolchain"]
run = "bun lint --no-script"

[tasks."lint:fix"]
description = "Lint the repository and write fixes (extra arguments go to bun lint, e.g. --staged)"
depends = ["toolchain"]
run = "bun lint --no-script --fix"

[tasks.fmt]
description = "Format the repository in place (extra arguments go to bun fmt, e.g. --staged)"
depends = ["toolchain"]
run = "bun fmt --no-script"

[tasks."fmt:check"]
description = "Check formatting without writing"
depends = ["toolchain"]
run = "bun fmt --no-script --check"

[tasks.test]
description = "Run the test suite"
run = "bun test"

[tasks.vendor]
description = "Download, verify and extract the pinned ripgrep and fd into the plugin; does nothing when they are in place"
run = "bun scripts/vendor.ts"

[tasks.build]
description = "Generate the Claude plugin from the instructions, the route table and the runtime"
depends = ["vendor"]
run = "bun packages/integrations/claude/build.ts"

[tasks.verify]
description = "Run every read-only gate: check, lint, fmt:check and test"
depends = ["check", "lint", "fmt:check", "test"]

# One version for every package and manifest (0.X.Y, or 0.X.Y-Z for the Zth hotfix). The script
# rewrites the package.json files and bun.lock, and the build regenerates the plugin manifests from
# them, so commit the result of the task as a whole.

[tasks."bump:minor"]
description = "Bump the minor version (0.X.Y to 0.(X+1).0) everywhere and rebuild the plugin"
run = ["bun scripts/bump-version.ts minor", { task = "build" }]

[tasks."bump:patch"]
description = "Bump the patch version (0.X.Y to 0.X.(Y+1)) everywhere and rebuild the plugin"
run = ["bun scripts/bump-version.ts patch", { task = "build" }]

[tasks."bump:hotfix"]
description = "Bump the hotfix version (0.X.Y to 0.X.Y-1, 0.X.Y-1 to 0.X.Y-2) everywhere and rebuild the plugin"
run = ["bun scripts/bump-version.ts hotfix", { task = "build" }]
