[tools]
# ctx7 runs on Node.
node = "lts"
# The toolchain is Bun's builtin `bun check`, `bun lint` and `bun fmt`, which exist only in canary
# builds, and mise cannot install bun@canary. mise installs the stable base and the postinstall hook
# below upgrades it to canary; the `toolchain` task, which every gate depends on, fails on a
# non-canary Bun and names the fix.
bun = "1.4.4"

[hooks]
# Runs after `mise install` (also on `mise use` and the automatic install before `mise run`), with
# the mise-installed Bun first on PATH. Idempotent: a canary Bun is left alone. BUN_OPTIONS is unset
# for the upgrade because Bun reads its flags (e.g. --smol) as package names and refuses. The
# commands are Bun scripts, not shell text, so they run the same under sh and cmd (native Windows).
postinstall = "bun scripts/toolchain.ts upgrade"

# mise tasks are the single source of truth for commands. package.json scripts and lefthook only
# delegate here, and `--no-script` makes Bun run its own tool instead of the same-named script.

[tasks.toolchain]
description = "Fail unless Bun is a canary build"
run = "bun scripts/toolchain.ts check"

[tasks.prepare]
description = "Install the git hooks (skipped outside a git work tree, e.g. a `git archive` export)"
run = "bun scripts/prepare.ts"

[tasks.check]
description = "Type-check the repository"
depends = ["toolchain"]
run = "bun check --no-script"

[tasks.lint]
description = "Lint the repository with type-aware rules, without fixing"
depends = ["toolchain"]
run = "bun lint --no-script"

[tasks."lint:fix"]
description = "Lint the repository and write fixes (extra arguments go to bun lint, e.g. --staged)"
depends = ["toolchain"]
run = "bun lint --no-script --fix"

[tasks.fmt]
description = "Format the repository in place (extra arguments go to bun fmt, e.g. --staged)"
depends = ["toolchain"]
run = "bun fmt --no-script"

[tasks."fmt:check"]
description = "Check formatting without writing"
depends = ["toolchain"]
run = "bun fmt --no-script --check"

[tasks.test]
description = "Run the test suite"
run = "bun test"

[tasks.vendor]
description = "Download, verify and extract the pinned ripgrep and fd into the plugin; does nothing when they are in place"
run = "bun scripts/vendor.ts"

[tasks.build]
description = "Generate the Claude plugin from the instructions, the route table and the runtime"
depends = ["vendor"]
run = "bun packages/integrations/claude/build.ts"

[tasks."instructions:scaffold"]
description = "Copy the instructions' requirements tree into every supported model family as empty files; adds missing paths and never overwrites"
run = "bun packages/runtime/scripts/instructions-scaffold.ts"

[tasks.verify]
description = "Run every read-only gate: check, lint, fmt:check and test"
depends = ["check", "lint", "fmt:check", "test"]

# One version for every package and manifest (ZeroVer, 0.X.Y). A bump edits the root package.json
# only; the build copies it to the workspace package.json files and bun.lock, then generates the
# plugin manifests from them, so commit the result of the task as a whole.

[tasks."bump:minor"]
description = "Bump the root package.json minor version (0.X.Y to 0.(X+1).0), then rebuild to sync every copy"
run = ["bun scripts/bump-version.ts minor", { task = "build" }]

[tasks."bump:patch"]
description = "Bump the root package.json patch version (0.X.Y to 0.X.(Y+1)), then rebuild to sync every copy"
run = ["bun scripts/bump-version.ts patch", { task = "build" }]

# Dependencies move only through the updater (see AGENTS.md): it keeps every pin on the newest
# stable release line, never a prerelease.

[tasks."deps:update"]
description = "Move every pinned dependency to its newest stable release and refresh the lockfile (--dry-run prints current -> next and writes nothing)"
run = "bun scripts/update-dependencies.ts"

[tasks."deps:check"]
description = "Fail when a pinned dependency is behind its newest stable release"
run = "bun scripts/update-dependencies.ts --check"
